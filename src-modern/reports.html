<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reportes operativos e indicadores de demostración" />
    <meta name="theme-color" content="#1A365D" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <title>Reportes y BI</title>
  </head>
  <body data-page="reports-workspace" class="admin-layout">
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="admin-app">
      <div class="admin-wrapper" id="admin-wrapper">
        <!-- APP_HEADER --><!-- APP_SIDEBAR -->
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main id="main-content" class="admin-main">
          <div
            class="container-fluid shell-page project-workspace delivery-nine-workspace reports-workspace"
            x-data="reportsWorkspace"
          >
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Reportes y BI</li>
              </ol>
            </nav>
            <template x-if="!allowed"
              ><div class="card">
                <div class="card-body workspace-empty">
                  <h1>Reportes no disponibles</h1>
                  <p>Esta presentación no incluye el módulo de reportes.</p>
                  <a class="btn btn-primary" href="./index.html">Volver al inicio</a>
                </div>
              </div></template
            >
            <template x-if="allowed"
              ><div>
                <div class="shell-page-heading">
                  <div>
<h1 x-text="hasBI ? 'Reportes y BI' : 'Reportes'"></h1>
                    <p class="shell-page-subtitle">
                      Indicadores calculados desde las operaciones de cada proyecto.
                    </p>
                  </div>
                </div>
                <div class="alert alert-info" role="note">
                  Los indicadores de presupuesto y costo son
                  acumulados; el filtro de período limita movimientos y la vista mensual, sin
                  cambiar esos totales.
                </div>
                <nav class="d9-tabs" aria-label="Secciones de Reportes">
                  <button
                    type="button"
                    :class="tab === 'reports' ? 'active' : ''"
                    :aria-current="tab === 'reports' ? 'page' : null"
                    @click="setTab('reports')"
                  >
                    Reportes</button
                  ><button
                    type="button"
                    x-show="hasBI"
                    :class="tab === 'bi' ? 'active' : ''"
                    :aria-current="tab === 'bi' ? 'page' : null"
                    @click="setTab('bi')"
                  >
                    BI gerencial
                  </button>
                </nav>
                <section class="card mb-3" aria-label="Filtros de reportes">
                  <div class="card-body reports-filters">
                    <div>
                      <label class="form-label" for="reports-project">Proyecto</label
                      ><select
                        id="reports-project"
                        class="form-select"
                        x-model="projectFilter"
                        @change="updateFilters()"
                      >
                        <option value="">Todos</option>
                        <template x-for="item in projects" :key="item.id"
                          ><option :value="item.id" x-text="item.id"></option
                        ></template>
                      </select>
                    </div>
                    <div>
                      <label class="form-label" for="reports-client">Cliente</label
                      ><select
                        id="reports-client"
                        class="form-select"
                        x-model="clientFilter"
                        @change="updateFilters()"
                      >
                        <option value="">Todos</option>
                        <template x-for="item in clients" :key="item.id"
                          ><option :value="item.id" x-text="item.name"></option
                        ></template>
                      </select>
                    </div>
                    <div>
                      <label class="form-label" for="reports-status">Estado</label
                      ><select
                        id="reports-status"
                        class="form-select"
                        x-model="statusFilter"
                        @change="updateFilters()"
                      >
                        <option value="ejecucion">En ejecución (activos y en riesgo)</option>
                        <option value="todos">Todos los estados</option>
                        <option value="Planificado">Planificado</option>
                        <option value="Activo">Activo</option>
                        <option value="En riesgo">En riesgo</option>
                        <option value="Suspendido">Suspendido</option>
                        <option value="Cerrado">Cerrado</option>
                      </select>
                    </div>
                    <div>
                      <label class="form-label" for="reports-period">Movimientos del mes</label
                      ><select
                        id="reports-period"
                        class="form-select"
                        x-model="periodFilter"
                        @change="updateFilters()"
                      >
                        <option value="">Todos</option>
                        <template x-for="month in months" :key="month"
                          ><option :value="month" x-text="month"></option
                        ></template>
                      </select>
                    </div>
                    <button type="button" class="btn btn-outline-secondary" @click="clearFilters()">
                      Limpiar
                    </button>
                  </div>
                </section>
                <section x-show="tab === 'reports'" aria-label="Catálogo de reportes">
                  <div class="reports-catalog">
                    <template x-for="report in reportDefs" :key="report.id"
                      ><button
                        type="button"
                        class="card reports-catalog-card"
                        :class="reportId === report.id ? 'active' : ''"
                        @click="setReport(report.id)"
                      >
                        <span class="reports-catalog-icon"
                          ><i class="bi bi-file-earmark-bar-graph" aria-hidden="true"></i></span
                        ><strong x-text="report.label"></strong
                        ><small x-text="report.description"></small
                        ><span class="reports-view-label">Ver reporte →</span>
                      </button></template
                    >
                  </div>
                  <section class="card" aria-labelledby="reports-result-title">
                    <div class="card-body">
                      <div class="shell-section-header">
                        <div>
                          <h2 id="reports-result-title" x-text="`Reporte de ${reportTitle}`"></h2>
                          <p class="workspace-caption">
                            Registros del conjunto mock; cada fila abre su origen.
                          </p>
                        </div>
                        <span
                          class="workspace-caption"
                          x-text="`${reportRows.length} registros`"
                        ></span>
                      </div>
                      <div class="table-responsive d-none d-lg-block">
                        <table class="table align-middle d9-table">
                          <thead>
                            <tr>
                              <th scope="col">Código</th>
                              <th scope="col">Detalle</th>
                              <th scope="col">Proyecto</th>
                              <th scope="col">Fecha</th>
                              <th scope="col">Importe referencial</th>
                              <th scope="col">Abrir</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="row in reportRows" :key="row.id"
                              ><tr>
                                <td><a :href="row.href" x-text="row.id"></a></td>
                                <td>
                                  <strong x-text="row.label"></strong
                                  ><small class="d-block" x-text="row.detail"></small>
                                </td>
                                <td>
                                  <a
                                    :href="moduleHref('projects', row.projectId)"
                                    x-text="row.projectId"
                                  ></a>
                                </td>
                                <td x-text="formatDate(row.date)"></td>
                                <td
                                  x-text="row.amount === null ? '—' : formatMoney(row.amount)"
                                ></td>
                                <td><a :href="row.href">Ver →</a></td>
                              </tr></template
                            >
                          </tbody>
                        </table>
                      </div>
                      <div class="d9-mobile-list d-lg-none">
                        <template x-for="row in reportRows" :key="row.id"
                          ><article class="d9-mobile-card">
                            <div class="d9-mobile-heading">
                              <strong x-text="row.id"></strong
                              ><span
                                x-text="row.amount === null ? '' : formatMoney(row.amount)"
                              ></span>
                            </div>
                            <small x-text="`${row.label} · ${formatDate(row.date)}`"></small
                            ><a
                              :href="moduleHref('projects', row.projectId)"
                              x-text="row.projectId"
                            ></a
                            ><a class="btn btn-outline-primary" :href="row.href">Abrir registro</a>
                          </article></template
                        >
                      </div>
                      <div class="d9-empty" x-show="reportRows.length === 0">
                        <i class="bi bi-bar-chart" aria-hidden="true"></i>
                        <p>No hay registros para este reporte y filtro.</p>
                        <button
                          type="button"
                          class="btn btn-outline-primary"
                          @click="clearFilters()"
                        >
                          Limpiar filtros
                        </button>
                      </div>
                    </div>
                  </section>
                </section>
                <section x-show="tab === 'bi' && hasBI" aria-label="Indicadores gerenciales">
                  <div class="d9-kpis">
                    <div class="card">
                      <div class="card-body">
                        <small>Proyectos en alcance</small
                        ><strong x-text="scopeFinancials.projects"></strong>
                      </div>
                    </div>
                    <div class="card">
                      <div class="card-body">
                        <small>Presupuesto acumulado</small
                        ><strong x-text="formatMoney(scopeFinancials.budget)"></strong>
                      </div>
                    </div>
                    <div class="card">
                      <div class="card-body">
                        <small>Costo ejecutado acumulado</small
                        ><strong x-text="formatMoney(scopeFinancials.executed)"></strong>
                      </div>
                    </div>
                    <div class="card">
                      <div class="card-body">
                        <small>Proyectos en riesgo</small
                        ><strong x-text="scopeFinancials.risk"></strong>
                      </div>
                    </div>
                  </div>
                  <div class="row g-3 mb-3">
                    <div class="col-xl-7">
                      <section class="card h-100" aria-labelledby="reports-budget-title">
                        <div class="card-body">
                          <div class="shell-section-header">
                            <h2 id="reports-budget-title">Presupuesto vs. ejecutado</h2>
                            <span class="workspace-caption">Por proyecto · acumulado</span>
                          </div>
                          <div
                            id="reports-budget-chart"
                            role="img"
                            aria-label="Gráfico de presupuesto y costo ejecutado por proyecto"
                          ></div>
                          <div class="reports-chart-values">
                            <template x-for="item in scopedProjects" :key="item.id"
                              ><a :href="moduleHref('projects', item.id)"
                                ><strong x-text="item.id"></strong
                                ><span
                                  x-text="`Presupuesto ${formatMoney(item.budgetAmount)} · Ejecutado ${formatMoney(getProjectFinancials(item.id).executedCost)}`"
                                ></span></a
                            ></template>
                          </div>
                        </div>
                      </section>
                    </div>
                    <div class="col-xl-5">
                      <section class="card h-100" aria-labelledby="reports-sources-title">
                        <div class="card-body">
                          <div class="shell-section-header">
                            <h2 id="reports-sources-title">Costos por fuente</h2>
                            <span class="workspace-caption">Selecciona para desglosar</span>
                          </div>
                          <div
                            id="reports-source-chart"
                            role="img"
                            aria-label="Distribución del costo ejecutado por fuente"
                          ></div>
                          <div class="reports-source-list">
                            <template x-for="source in sourceRows" :key="source.id"
                              ><button
                                type="button"
                                :class="selectedSource === source.id ? 'active' : ''"
                                @click="setSource(source.id)"
                              >
                                <span x-text="source.label"></span
                                ><strong x-text="formatMoney(source.amount)"></strong></button
                            ></template>
                          </div>
                          <div class="reports-source-detail" x-show="selectedSource">
                            <strong
                              x-text="`Fuente: ${sourceRows.find(item => item.id === selectedSource)?.label || ''}`"
                            ></strong
                            ><template x-for="item in sourceProjects" :key="item.projectId"
                              ><a
                                :href="`./costs.html?project=${encodeURIComponent(item.projectId)}&source=${encodeURIComponent(selectedSource)}`"
                                ><span x-text="item.projectId"></span
                                ><span x-text="formatMoney(item.amount)"></span></a
                            ></template>
                            <p class="workspace-caption" x-show="sourceProjects.length === 0">
                              Sin operaciones ejecutadas en esta fuente.
                            </p>
                          </div>
                        </div>
                      </section>
                    </div>
                  </div>
                  <div class="row g-3 mb-3">
                    <div class="col-xl-5">
                      <section class="card h-100" aria-labelledby="reports-monthly-title">
                        <div class="card-body">
                          <h2 class="workspace-subheading mt-0" id="reports-monthly-title">
                            Costo por mes
                          </h2>
                          <p class="workspace-caption">
                            Solo operaciones ejecutadas del período seleccionado.
                          </p>
                          <div class="d9-link-list">
                            <template x-for="item in monthlyCosts" :key="item.month"
                              ><div>
                                <span x-text="item.month"></span
                                ><strong x-text="formatMoney(item.amount)"></strong></div
                            ></template>
                          </div>
                          <p class="workspace-caption" x-show="monthlyCosts.length === 0">
                            No hay movimientos en ese mes.
                          </p>
                        </div>
                      </section>
                    </div>
                    <div class="col-xl-7">
                      <section class="card h-100" aria-labelledby="reports-manager-title">
                        <div class="card-body">
                          <div class="shell-section-header">
                            <h2 id="reports-manager-title">Proyectos e indicadores</h2>
                            <span class="workspace-caption">Ir a ficha o fuente</span>
                          </div>
                          <div class="table-responsive">
                            <table class="table align-middle reports-manager-table">
                              <thead>
                                <tr>
                                  <th scope="col">Proyecto</th>
                                  <th scope="col">Avance</th>
                                  <th scope="col">Presupuesto</th>
                                  <th scope="col">Ejecutado</th>
                                  <th scope="col">Estado</th>
                                  <th scope="col">Costos</th>
                                </tr>
                              </thead>
                              <tbody>
                                <template x-for="item in scopedProjects" :key="item.id"
                                  ><tr>
                                    <td>
                                      <a
                                        :href="moduleHref('projects', item.id)"
                                        x-text="item.id"
                                      ></a>
                                    </td>
                                    <td x-text="`${item.progressPercent} %`"></td>
                                    <td x-text="formatMoney(item.budgetAmount)"></td>
                                    <td
                                      x-text="formatMoney(getProjectFinancials(item.id).executedCost)"
                                    ></td>
                                    <td x-text="item.status"></td>
                                    <td>
                                      <a :href="moduleHref('costs', item.id)">Ver fuentes →</a>
                                    </td>
                                  </tr></template
                                >
                              </tbody>
                            </table>
                          </div>
                          <p class="workspace-caption" x-show="scopedProjects.length === 0">
                            No hay proyectos con estos filtros.
                          </p>
                        </div>
                      </section>
                    </div>
                  </div>
                </section>
              </div></template
            >
          </div>
        </main>
        <!-- APP_FOOTER -->
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
