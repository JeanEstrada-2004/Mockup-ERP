<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detalle de orden de compra" />
    <meta name="theme-color" content="#1A365D" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <title>Orden de Compra</title>
  </head>
  <body data-page="purchase-detail" class="admin-layout">
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="admin-app">
      <div class="admin-wrapper" id="admin-wrapper">
        <!-- APP_HEADER -->
        <!-- APP_SIDEBAR -->
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main id="main-content" class="admin-main">
          <div
            class="container-fluid shell-page project-workspace commercial-workspace"
            x-data="purchaseDetail"
          >
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item"><a href="./purchases.html">Compras</a></li>
                <li
                  class="breadcrumb-item active"
                  aria-current="page"
                  x-text="purchase?.id || 'No encontrada'"
                ></li>
              </ol>
            </nav>
            <template x-if="!purchase"
              ><div class="card">
                <div class="card-body workspace-empty">
                  <h1>Orden de Compra no encontrada</h1>
                  <p>El código solicitado no pertenece a esta presentación.</p>
                  <a class="btn btn-primary" href="./purchases.html">Ver órdenes</a>
                </div>
              </div></template
            >
            <template x-if="purchase"
              ><div>
                <div class="shell-page-heading workspace-detail-heading">
                  <div>
<h1 x-text="purchase.id"></h1>
                    <p class="shell-page-subtitle">
                      <span x-text="supplierName(purchase.supplierId)"></span
                      ><span
                        class="badge ms-2"
                        :class="statusClass(displayStatus)"
                        x-text="displayStatus"
                      ></span
                      ><span class="commercial-version-tag" x-show="demoStatus"
                        >Simulación local</span
                      >
                    </p>
                  </div>
                  <a class="btn btn-outline-primary btn-sm" :href="backHref"
                    ><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver a Compras</a
                  >
                </div>
                <div class="commercial-action-bar mb-3">
                  <button
                    type="button"
                    class="btn btn-primary btn-sm"
                    x-show="canApprove"
                    @click="openApprovalModal()"
                  >
                    Aprobar OC</button
                  ><button
                    type="button"
                    class="btn btn-outline-success btn-sm"
                    x-show="canReceive"
                    @click="openReceiptModal()"
                  >
                    Registrar recepción</button
                  ><button
                    type="button"
                    class="btn btn-outline-primary btn-sm"
                    x-show="canIssue"
                    @click="issue()"
                  >
                    Emitir OC</button
                  ><button type="button" class="btn btn-outline-secondary btn-sm" @click="generateDocument()">
                    <i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i>Generar documento</button
                  ><a class="btn btn-outline-secondary btn-sm" href="#historial"
                    ><i class="bi bi-clock-history me-1" aria-hidden="true"></i>Ver historial</a
                  ><a
                    class="btn btn-outline-secondary btn-sm"
                    x-show="warehouseHref"
                    :href="warehouseHref"
                    >Ver entrada en almacén</a
                  ><a class="btn btn-outline-secondary btn-sm" :href="projectHref">Ver proyecto</a
                  ><a class="btn btn-outline-secondary btn-sm" :href="documentHref"
                    >Documento mock</a
                  >
                </div>

                <div
                  class="alert alert-warning commercial-budget-alert"
                  role="status"
                  x-show="exceedsBalance"
                >
                  <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>Esta OC supera
                  el saldo disponible para nuevos compromisos. La aprobación simulada no se bloquea.
                </div>
                <div
                  class="alert alert-warning commercial-budget-alert"
                  role="status"
                  x-show="!exceedsBalance && projectRisk"
                >
                  <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>Este proyecto ya
                  ejecutó <strong x-text="`${financials.executionPercent} %`"></strong> de su
                  presupuesto. Revisa el saldo antes de nuevas compras.
                </div>
                <div
                  class="alert alert-info commercial-budget-alert"
                  role="status"
                  x-show="!exceedsBalance && !projectRisk && !purchase.costSource && !purchase.inventoryLine"
                >
                  <i class="bi bi-info-circle me-2" aria-hidden="true"></i>La OC cabe en el saldo
                  disponible de referencia. La aprobación es solo visual.
                </div>
                <div
                  class="alert alert-info commercial-budget-alert"
                  role="note"
                  x-show="purchase.inventoryLine"
                >
                  <i class="bi bi-info-circle me-2" aria-hidden="true"></i>Esta OC ficticia recibió
                  material en almacén. Su compra no se suma al costo ejecutado; el costo se muestra
                  en la salida vinculada al proyecto.
                </div>

                <div class="row g-3">
                  <div class="col-xl-8">
                    <div class="d-grid gap-3">
                      <section class="card" aria-labelledby="purchase-information-title">
                        <div class="card-body">
                          <h2 id="purchase-information-title" class="workspace-subheading mt-0">
                            Datos de la orden
                          </h2>
                          <div class="commercial-facts">
                            <div><span>N.º OC</span><strong x-text="purchase.id"></strong></div>
                            <div>
                              <span>Proveedor</span
                              ><strong x-text="supplierName(purchase.supplierId)"></strong>
                            </div>
                            <div>
                              <span>Proyecto</span><a :href="projectHref" x-text="project.name"></a>
                            </div>
                            <div>
                              <span>Fecha</span><strong x-text="formatDate(purchase.date)"></strong>
                            </div>
                            <div><span>Moneda</span><strong>Soles (PEN)</strong></div>
                            <div>
                              <span>Presupuesto asociado</span
                              ><a
                                x-show="budgetHref"
                                :href="budgetHref"
                                x-text="project.budgetId"
                              ></a
                              ><strong x-show="!budgetHref" x-text="project.budgetId"></strong>
                            </div>
                          </div>
                        </div>
                      </section>
                      <section class="card" aria-labelledby="purchase-lines-title">
                        <div class="card-body">
                          <div class="shell-section-header">
                            <h2 id="purchase-lines-title">Partidas de la OC</h2>
                            <span class="workspace-caption"
                              >Desglose referencial del importe mock</span
                            >
                          </div>
                          <p class="workspace-caption d-sm-none">
                            Desliza la tabla para ver todas las columnas.
                          </p>
                          <div
                            class="table-responsive"
                            tabindex="0"
                            aria-label="Partidas de la orden de compra, desplazamiento horizontal"
                          >
                            <table class="table align-middle commercial-lines-table">
                              <thead>
                                <tr>
                                  <th scope="col">Código</th>
                                  <th scope="col">Producto / servicio</th>
                                  <th scope="col">Unidad</th>
                                  <th scope="col">Cantidad</th>
                                  <th scope="col">Precio unit.</th>
                                  <th scope="col">Importe</th>
                                </tr>
                              </thead>
                              <tbody>
                                <template x-for="item in breakdown.items" :key="item.code"
                                  ><tr>
                                    <td x-text="item.code"></td>
                                    <td x-text="item.description"></td>
                                    <td x-text="item.unit"></td>
                                    <td x-text="item.quantity"></td>
                                    <td x-text="formatAmount(item.unitPrice)"></td>
                                    <td
                                      class="fw-semibold"
                                      x-text="formatAmount(item.subtotal)"
                                    ></td></tr
                                ></template>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </section>
                    </div>
                  </div>
                  <div class="col-xl-4">
                    <div class="d-grid gap-3">
                      <section class="card" aria-labelledby="purchase-total-title">
                        <div class="card-body">
                          <h2 id="purchase-total-title" class="workspace-subheading mt-0">
                            Resumen de importes
                          </h2>
                          <div class="commercial-totals">
                            <div>
                              <span>Subtotal</span
                              ><strong x-text="formatAmount(breakdown.subtotal)"></strong>
                            </div>
                            <div>
                              <span>IGV + IPM (18 %)</span
                              ><strong x-text="formatAmount(breakdown.tax)"></strong>
                            </div>
                            <div class="commercial-grand-total">
                              <span>Total de la OC</span
                              ><strong x-text="formatAmount(breakdown.total)"></strong>
                            </div>
                          </div>
                        </div>
                      </section>
                      <section class="card" aria-labelledby="purchase-balance-title">
                        <div class="card-body">
                          <h2 id="purchase-balance-title" class="workspace-subheading mt-0">
                            Saldo presupuestario
                          </h2>
                          <div class="commercial-totals">
                            <div>
                              <span>Presupuesto del proyecto</span
                              ><strong x-text="formatMoney(financials.budgetAmount)"></strong>
                            </div>
                            <div>
                              <span>Costo ejecutado</span
                              ><strong x-text="formatMoney(financials.executedCost)"></strong>
                            </div>
                            <div>
                              <span>Compromisos abiertos</span
                              ><strong
                                x-text="formatMoney(financials.outstandingCommitments)"
                              ></strong>
                            </div>
                            <div class="commercial-grand-total">
                              <span>Disponible actual</span
                              ><strong x-text="formatMoney(financials.availableToCommit)"></strong>
                            </div>
                          </div>
                          <p class="workspace-caption">
                            Las simulaciones no modifican estas cifras compartidas.
                          </p>
                        </div>
                      </section>
                      <section class="card" aria-labelledby="purchase-progress-title">
                        <div class="card-body">
                          <h2 id="purchase-progress-title" class="workspace-subheading mt-0">
                            Aprobación y recepción
                          </h2>
                          <ol class="commercial-steps">
                            <li>
                              <strong>OC registrada</strong
                              ><small x-text="formatDate(purchase.date)"></small>
                            </li>
                            <li>
                              <strong>Aprobación</strong
                              ><small
                                x-text="displayStatus === 'Pendiente' ? 'Pendiente' : demoStatus ? 'Simulada en esta vista' : 'Según registro mock'"
                              ></small>
                            </li>
                            <li>
                              <strong>Recepción</strong
                              ><small
                                x-text="displayStatus === 'Atendida' ? demoStatus ? 'Simulada en esta vista' : 'Registrada en datos mock' : 'Pendiente'"
                              ></small>
                            </li>
                          </ol>
                        </div>
                      </section>
                    </div>
                  </div>
                </div>

                <section class="card mt-3" id="historial" aria-labelledby="purchase-history-title">
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="purchase-history-title">Historial de la orden</h2>
                      <span class="workspace-caption" x-text="`${history.length} eventos`"></span>
                    </div>
                    <ol class="record-timeline">
                      <template x-for="(event, index) in history" :key="index">
                        <li>
                          <i aria-hidden="true"></i>
                          <span><b x-text="event.label"></b><small x-text="event.note"></small></span>
                          <time x-text="event.when"></time>
                        </li>
                      </template>
                    </ol>
                  </div>
                </section>

                <div
                  class="modal fade"
                  id="purchase-approval-modal"
                  tabindex="-1"
                  aria-labelledby="purchase-approval-modal-title"
                  aria-hidden="true"
                >
                  <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h2 class="modal-title fs-5" id="purchase-approval-modal-title">
                          Aprobar OC (simulación)
                        </h2>
                        <button
                          type="button"
                          class="btn-close"
                          data-bs-dismiss="modal"
                          aria-label="Cerrar"
                        ></button>
                      </div>
                      <div class="modal-body">
                        <p>
                          Se mostrará la OC como aprobada solo en esta vista. No se procesan pagos
                          ni se altera el saldo del proyecto.
                        </p>
                        <div class="commercial-totals">
                          <div><span>Orden</span><strong x-text="purchase.id"></strong></div>
                          <div>
                            <span>Total</span
                            ><strong x-text="formatAmount(breakdown.total)"></strong>
                          </div>
                        </div>
                      </div>
                      <div class="modal-footer">
                        <button
                          type="button"
                          class="btn btn-outline-secondary"
                          data-bs-dismiss="modal"
                        >
                          Cancelar</button
                        ><button type="button" class="btn btn-primary" @click="approve()">
                          Confirmar aprobación
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                <div
                  class="modal fade"
                  id="purchase-receipt-modal"
                  tabindex="-1"
                  aria-labelledby="purchase-receipt-modal-title"
                  aria-hidden="true"
                >
                  <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h2 class="modal-title fs-5" id="purchase-receipt-modal-title">
                          Registrar recepción (simulación)
                        </h2>
                        <button
                          type="button"
                          class="btn-close"
                          data-bs-dismiss="modal"
                          aria-label="Cerrar"
                        ></button>
                      </div>
                      <div class="modal-body">
                        <p>
                          La recepción aparecerá solo en esta vista. No se incrementará el costo
                          ejecutado ni se generará un comprobante real.
                        </p>
                        <p class="mb-0">
                          <strong x-text="purchase.id"></strong> ·
                          <span x-text="supplierName(purchase.supplierId)"></span>
                        </p>
                      </div>
                      <div class="modal-footer">
                        <button
                          type="button"
                          class="btn btn-outline-secondary"
                          data-bs-dismiss="modal"
                        >
                          Cancelar</button
                        ><button type="button" class="btn btn-success" @click="receive()">
                          Confirmar recepción
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div></template
            >
          </div>
        </main>
        <!-- APP_FOOTER -->
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
