          <div
            class="container-fluid shell-page project-workspace delivery-nine-workspace administration-workspace"
            x-data="administrationWorkspace"
          >
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Administración</li>
              </ol>
            </nav>
            <template x-if="!allowed"
              ><div class="card">
                <div class="card-body workspace-empty">
                  <h1>Administración no disponible</h1>
                  <p>Este módulo no forma parte de esta presentación.</p>
                  <a class="btn btn-primary" href="./index.html">Volver al inicio</a>
                </div>
                <section class="card" x-show="tab === 'notificaciones'" x-cloak aria-labelledby="admin-notifications-title">
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="admin-notifications-title">Notificaciones</h2>
                      <button type="button" class="btn btn-primary btn-sm" @click="saveNotifications()">Guardar</button>
                    </div>
                    <div class="table-responsive data-table">
                      <table class="table align-middle mb-0">
                        <thead>
                          <tr>
                            <th scope="col">Categoría</th>
                            <th scope="col">Ejemplo</th>
                            <th scope="col" class="text-center">Plataforma</th>
                            <th scope="col" class="text-center">Correo</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="rule in notificationRules" :key="rule.id">
                            <tr>
                              <td><strong x-text="rule.label"></strong></td>
                              <td x-text="rule.example"></td>
                              <td class="text-center"><div class="form-check form-switch d-inline-block"><input class="form-check-input" type="checkbox" role="switch" x-model="rule.app" :aria-label="`${rule.label} en la plataforma`" /></div></td>
                              <td class="text-center"><div class="form-check form-switch d-inline-block"><input class="form-check-input" type="checkbox" role="switch" x-model="rule.mail" :aria-label="`${rule.label} por correo`" /></div></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </section>
                <section class="card" x-show="tab === 'apariencia'" x-cloak aria-labelledby="admin-appearance-title">
                  <div class="card-body">
                    <h2 id="admin-appearance-title" class="workspace-subheading mt-0">Apariencia</h2>
                    <div class="d9-facts mb-3">
                      <div><small>Presentación</small><strong x-text="`${company.shortName} · ${presentationCode}`"></strong></div>
                      <div><small>Tipografía</small><strong>Plus Jakarta Sans e Inter</strong></div>
                    </div>
                    <div class="ds-row">
                      <span class="admin-swatch admin-swatch--rail" title="Riel"></span>
                      <span class="admin-swatch admin-swatch--solid" title="Color principal"></span>
                      <span class="admin-swatch admin-swatch--accent" title="Acento"></span>
                      <span class="admin-swatch admin-swatch--hero" title="Degradado de marca"></span>
                    </div>
                    <h3 class="form-section-title">Tema</h3>
                    <div class="ds-row">
                      <button type="button" class="btn btn-outline-secondary" @click="setTheme('light')"><i class="bi bi-sun" aria-hidden="true"></i> Claro</button>
                      <button type="button" class="btn btn-outline-secondary" @click="setTheme('dark')"><i class="bi bi-moon" aria-hidden="true"></i> Oscuro</button>
                    </div>
                  </div>
                </section>
                <section class="card" x-show="tab === 'general'" x-cloak aria-labelledby="admin-general-title">
                  <div class="card-body">
                    <h2 id="admin-general-title" class="workspace-subheading mt-0">Configuración general</h2>
                    <div class="d9-facts">
                      <template x-for="[label, value] in generalSettings" :key="label">
                        <div><small x-text="label"></small><strong x-text="value"></strong></div>
                      </template>
                    </div>
                  </div>
                </section>
              </div></template
            >
            <template x-if="allowed"
              ><div>
                <div class="shell-page-heading">
                  <div>
<h1>Administración del Sistema</h1>
                    <p class="shell-page-subtitle">
                      Empresa, catálogos, parámetros, notificaciones y apariencia.
                    </p>
                  </div>
                </div>
                <div class="alert alert-info" role="note">
                  Configuración de demostración: los cambios se muestran en esta sesión y no
                  configuran servicios reales.
                </div>
                <div class="d9-tabs" role="tablist" aria-label="Secciones de administración">
                  <template x-for="[id, label] in tabs" :key="id">
                    <button
                      type="button"
                      role="tab"
                      :class="{ active: tab === id }"
                      :aria-selected="tab === id"
                      @click="setTab(id)"
                      x-text="label"
                    ></button>
                  </template>
                </div>
                <section
                  class="card"
                  x-show="tab === 'empresa'"
                  aria-labelledby="admin-company-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="admin-company-title">Empresa</h2>

                    </div>
                    <div class="admin-company-grid">
                      <div class="admin-company-brand">
                        <img
                          class="admin-logo-light"
                          :src="logo"
                          :alt="`Logotipo de ${company.shortName}`"
                        />
                        <img
                          class="admin-logo-dark"
                          :src="logoDark"
                          :alt="`Logotipo de ${company.shortName}`"
                        />
                        <p>Identidad visual de la variante actual</p>
                      </div>
                      <div class="d9-facts">
                        <div><small>Razón social</small><strong x-text="company.name"></strong></div>
                        <div><small>RUC</small><strong x-text="legal ? legal.ruc : 'Por completar con la empresa'"></strong></div>
                        <div><small>Dirección</small><strong x-text="legal ? legal.address : 'Por completar con la empresa'"></strong></div>
                        <div><small>Teléfono</small><strong x-text="legal ? legal.phone : 'Por completar con la empresa'"></strong></div>
                        <div><small>Correo</small><strong x-text="legal ? legal.email : 'Por completar con la empresa'"></strong></div>
                        <div><small>Moneda</small><strong>Soles (S/)</strong></div>
                        <div><small>Zona horaria</small><strong>America/Lima (UTC−5)</strong></div>
                      </div>
                    </div>
                  </div>
                </section>
                <section
                  class="card"
                  x-show="tab === 'catalogos'"
                  aria-labelledby="admin-catalog-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="admin-catalog-title">Catálogos</h2>
                      <span class="workspace-caption"
                        >Registros ficticios compartidos por los módulos habilitados</span
                      >
                    </div>
                    <div class="admin-catalog-layout">
                      <div class="admin-catalog-menu" aria-label="Elegir catálogo">
                        <template x-for="catalog in catalogs" :key="catalog.id">
                          <button
                            type="button"
                            :class="{ active: selectedCatalogId === catalog.id }"
                            :aria-pressed="selectedCatalogId === catalog.id"
                            @click="setCatalog(catalog.id)"
                          >
                            <span x-text="catalog.label"></span
                            ><span
                              class="badge text-bg-light"
                              x-text="catalog.entries.length"
                            ></span>
                          </button>
                        </template>
                      </div>
                      <div>
                        <div class="admin-catalog-heading">
                          <div>
                            <h3
                              class="workspace-subheading mt-0"
                              x-text="selectedCatalog?.label"
                            ></h3>
                            <p
                              class="workspace-caption mb-0"
                              x-text="`${filteredEntries.length} de ${selectedCatalog?.entries.length || 0} registros`"
                            ></p>
                          </div>
                          <div>
                            <label class="form-label" for="admin-catalog-search"
                              >Buscar registro</label
                            ><input
                              id="admin-catalog-search"
                              class="form-control"
                              type="search"
                              x-model="search"
                              @input="updateUrl()"
                              placeholder="Código o nombre"
                            />
                          </div>
                        </div>
                        <div
                          class="table-responsive d-none d-md-block"
                          x-show="filteredEntries.length"
                        >
                          <table class="table table-hover align-middle">
                            <thead>
                              <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="entry in filteredEntries" :key="entry.id"
                                ><tr>
                                  <td class="text-nowrap" x-text="entry.id"></td>
                                  <td x-text="entry.label"></td></tr
                              ></template>
                            </tbody>
                          </table>
                        </div>
                        <div class="d9-mobile-list d-md-none" x-show="filteredEntries.length">
                          <template x-for="entry in filteredEntries" :key="entry.id"
                            ><div class="d9-mobile-card">
                              <strong x-text="entry.label"></strong
                              ><small x-text="entry.id"></small></div
                          ></template>
                        </div>
                        <div class="d9-empty" x-show="filteredEntries.length === 0">
                          <i class="bi bi-search" aria-hidden="true"></i>
                          <p>No hay registros con este filtro.</p>
                          <button
                            type="button"
                            class="btn btn-outline-primary"
                            @click="clearSearch()"
                          >
                            Limpiar búsqueda
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
                <section
                  class="card"
                  x-show="tab === 'parametros'"
                  aria-labelledby="admin-parameters-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="admin-parameters-title">Parámetros</h2>
                      <span class="badge text-bg-secondary">Solo lectura</span>
                    </div>
                    <p class="workspace-caption">
                      Valores utilizados por las vistas del mockup; no modifican sistemas externos.
                    </p>
                    <dl class="admin-parameters">
                      <template x-for="item in parameters" :key="item.label"
                        ><div>
                          <dt x-text="item.label"></dt>
                          <dd x-text="item.value"></dd></div
                      ></template>
                    </dl>
                  </div>
                </section></div
            ></template>
          </div>
