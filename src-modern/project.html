<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ficha integral de proyecto" />
    <meta name="theme-color" content="#1A365D" />
    <!-- APP_FAVICON -->
    <title>Ficha Integral de Proyecto</title>
  </head>
  <body data-page="project-detail" class="admin-layout">
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="admin-app">
      <div class="admin-wrapper" id="admin-wrapper">
        <!-- APP_HEADER -->
        <!-- APP_SIDEBAR -->
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main id="main-content" class="admin-main">
          <div
            class="container-fluid shell-page project-workspace project-detail-workspace"
            x-data="projectDetail"
            @project-change.window="switchProject($event.detail.projectId)"
          >
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item"><a :href="backHref">Proyectos</a></li>
                <li class="breadcrumb-item" x-text="project?.id || 'No encontrado'"></li>
                <li
                  class="breadcrumb-item active"
                  aria-current="page"
                  x-text="tabs.find(item => item.id === tab)?.label"
                ></li>
              </ol>
            </nav>
            <template x-if="!project"
              ><div class="card">
                <div class="card-body workspace-empty">
                  <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                  <h1>Proyecto no encontrado</h1>
                  <p>El código solicitado no pertenece a esta presentación.</p>
                  <a class="btn btn-primary" href="./projects.html">Ver proyectos</a>
                </div>
              </div></template
            >
            <template x-if="project"
              ><div>
                <div class="shell-page-heading workspace-detail-heading">
                  <div>
                    <p class="project-code" x-text="project.id"></p>
                    <h1 x-text="project.name"></h1>
                    <div class="project-meta">
                      <span x-text="projectClient(project)"></span><span>·</span
                      ><span x-text="managerName"></span><span>·</span
                      ><span x-text="'Fin previsto ' + formatDate(project.endDate)"></span
                      ><span
                        class="badge"
                        :class="$statusClass(project.status)"
                        x-text="project.status"
                      ></span
                      ><span class="badge text-bg-secondary" x-show="project.demo"
                        >Demostración</span
                      >
                    </div>
                  </div>
                  <a class="btn btn-outline-primary" :href="backHref"
                    ><i class="bi bi-arrow-left me-1" aria-hidden="true"></i
                    ><span x-text="backLabel"></span
                  ></a>
                </div>
                <section class="kpi-strip" aria-label="Indicadores del proyecto">
                  <button class="kpi" type="button" @click="setTab('budget')">
                    <span class="kpi-label"><i class="kpi-dot"></i>Presupuesto</span
                    ><span class="kpi-value" x-count.money="financials.budgetAmount"></span
                    ><span class="kpi-foot">Base del proyecto</span>
                  </button>
                  <button class="kpi" type="button" @click="setTab('costs')">
                    <span class="kpi-label"><i class="kpi-dot kpi-dot--s2"></i>Costo ejecutado</span
                    ><span class="kpi-value" x-count.money="financials.executedCost"></span
                    ><span
                      class="kpi-foot"
                      x-text="String(financials.executionPercent).replace('.', ',') + ' % del presupuesto'"
                    ></span>
                  </button>
                  <button class="kpi" type="button" @click="setTab('costs')">
                    <span class="kpi-label"><i class="kpi-dot kpi-dot--s3"></i>Disponible</span
                    ><span
                      class="kpi-value"
                      x-count.money="financials.availableAgainstExecuted"
                    ></span
                    ><span class="kpi-foot">Presupuesto menos ejecutado</span>
                  </button>
                  <button class="kpi" type="button" @click="setTab('indicators')">
                    <span class="kpi-label"><i class="kpi-dot"></i>Avance</span
                    ><span class="kpi-value" x-count.pct="project.progressPercent"></span
                    ><span class="kpi-foot">Avance físico reportado</span>
                  </button>
                  <button class="kpi" type="button" @click="setTab('documents')">
                    <span class="kpi-label"><i class="kpi-dot kpi-dot--s4"></i>Documentos</span
                    ><span class="kpi-value" x-count="documents.length"></span
                    ><span class="kpi-foot">Referencias vinculadas</span>
                  </button>
                  <button class="kpi" type="button" @click="setTab('summary')">
                    <span class="kpi-label"><i class="kpi-dot kpi-dot--bad"></i>Alertas</span
                    ><span class="kpi-value" x-count="alertCount"></span
                    ><span class="kpi-foot">Pendientes o riesgo</span>
                  </button>
                </section>
                <div
                  class="workspace-tabs project-tabs"
                  role="tablist"
                  aria-label="Secciones de la ficha"
                >
                  <template x-for="item in tabs" :key="item.id"
                    ><button
                      type="button"
                      role="tab"
                      :id="'tab-' + item.id"
                      :data-project-tab="item.id"
                      :aria-controls="'panel-' + item.id"
                      :aria-selected="tab === item.id"
                      :tabindex="tab === item.id ? 0 : -1"
                      :class="tab === item.id ? 'active' : ''"
                      x-text="item.label"
                      @click="setTab(item.id)"
                      @keydown.arrow-right="moveTab($event, 1)"
                      @keydown.arrow-left="moveTab($event, -1)"
                    ></button
                  ></template>
                </div>
                <section
                  id="panel-summary"
                  role="tabpanel"
                  aria-labelledby="tab-summary"
                  x-show="tab === 'summary'"
                  class="project-tab-panel"
                >
                  <div class="panel-grid panel-grid--wide">
                    <div class="panel-stack">
                      <div class="panel">
                        <div class="panel-head">
                          <div>
                            <h2>Situación del proyecto</h2>
                            <p
                              x-text="project.description || 'Resumen de la ejecución y las operaciones vinculadas a este proyecto.'"
                            ></p>
                          </div>
                          <a x-show="!project.demo" :href="moduleHref('costs', project.id)"
                            >Ver costos →</a
                          >
                        </div>
                        <div class="project-budget-visual">
                          <div>
                            <span>Ejecutado</span
                            ><strong x-text="formatMoney(financials.executedCost)"></strong>
                          </div>
                          <div
                            class="progress"
                            role="progressbar"
                            :aria-valuenow="financials.executionPercent"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            aria-label="Presupuesto ejecutado"
                          >
                            <div
                              class="progress-bar"
                              :style="'width:' + executionWidth + '%'"
                            ></div>
                          </div>
                          <div>
                            <span>Presupuesto</span
                            ><strong x-text="formatMoney(financials.budgetAmount)"></strong>
                          </div>
                        </div>
                        <div class="workspace-summary-grid">
                          <div>
                            <span>Compromisos abiertos</span
                            ><strong
                              x-text="formatMoney(financials.outstandingCommitments)"
                            ></strong>
                          </div>
                          <div>
                            <span>Disponible para nuevos compromisos</span
                            ><strong x-text="formatMoney(financials.availableToCommit)"></strong>
                          </div>
                        </div>
                      </div>
                      <div class="panel">
                        <div class="panel-head">
                          <div>
                            <h2>Actividad reciente</h2>
                            <p>Operaciones relacionadas</p>
                          </div>
                        </div>
                        <div class="workspace-compact-list">
                          <template x-for="item in projectActivity" :key="item.id"
                            ><a :href="operationHref(item) || moduleHref('costs', project.id)"
                              ><span
                                ><strong x-text="item.id"></strong
                                ><small x-text="item.status"></small></span
                              ><time :datetime="item.date" x-text="formatDate(item.date)"></time></a
                          ></template>
                          <p x-show="!projectActivity.length">
                            Aún no hay operaciones registradas.
                          </p>
                        </div>
                      </div>
                    </div>
                    <div class="panel-stack">
                      <div class="panel">
                        <div class="panel-head">
                          <div><h2>Datos del proyecto</h2></div>
                        </div>
                        <div class="workspace-summary-grid">
                          <div>
                            <span>Cliente</span
                            ><strong
                              ><a x-show="clientHref" :href="clientHref" x-text="projectClient(project)"></a
                              ><span x-show="!clientHref" x-text="projectClient(project)"></span
                            ></strong>
                          </div>
                          <div><span>Responsable</span><strong x-text="managerName"></strong></div>
                          <div>
                            <span>Inicio</span
                            ><strong x-text="formatDate(project.startDate)"></strong>
                          </div>
                          <div>
                            <span>Fin previsto</span
                            ><strong x-text="formatDate(project.endDate)"></strong>
                          </div>
                          <div><span>Estado</span><strong x-text="project.status"></strong></div>
                          <div>
                            <span>Avance físico</span
                            ><strong x-text="project.progressPercent + ' %'"></strong>
                          </div>
                        </div>
                      </div>
                      <div class="panel">
                        <div class="panel-head">
                          <div><h2>Cronograma resumido</h2></div>
                        </div>
                        <div class="workspace-summary-grid">
                          <div>
                            <span>Inicio</span
                            ><strong x-text="formatDate(project.startDate)"></strong>
                          </div>
                          <div>
                            <span>Avance informado</span
                            ><strong x-text="project.progressPercent + ' %'"></strong>
                          </div>
                          <div>
                            <span>Fin previsto</span
                            ><strong x-text="formatDate(project.endDate)"></strong>
                          </div>
                        </div>
                      </div>
                      <div class="panel">
                        <div class="panel-head">
                          <div><h2>Atención pendiente</h2></div>
                        </div>
                        <p x-show="!alertCount">
                          No hay alertas ni operaciones pendientes en este proyecto.
                        </p>
                        <p
                          x-show="alertCount"
                          x-text="alertCount + ' registro(s) requieren seguimiento.'"
                        ></p>
                        <a x-show="!project.demo" :href="moduleHref('costs', project.id)"
                          >Revisar el origen →</a
                        >
                      </div>
                    </div>
                  </div>
                </section>
                <section
                  id="panel-budget"
                  role="tabpanel"
                  aria-labelledby="tab-budget"
                  x-show="tab === 'budget'"
                  x-cloak
                  class="project-tab-panel panel"
                >
                  <div class="panel-head">
                    <div>
                      <h2>Presupuesto del proyecto</h2>
                      <p>Base y compromisos vinculados</p>
                    </div>
                    <a
                      x-show="hasBudgets && budget && !project.demo"
                      :href="moduleHref('budgets', budget?.id)"
                      >Abrir en Presupuestos →</a
                    >
                  </div>
                  <div class="workspace-summary-grid">
                    <div>
                      <span>Presupuesto base</span
                      ><strong x-text="formatMoney(financials.budgetAmount)"></strong>
                    </div>
                    <div>
                      <span>Comprometido total</span
                      ><strong x-text="formatMoney(financials.committedCost)"></strong>
                    </div>
                    <div>
                      <span>Disponible para nuevos compromisos</span
                      ><strong x-text="formatMoney(financials.availableToCommit)"></strong>
                    </div>
                  </div>
                  <p x-show="!hasBudgets" class="mb-0">
                    La gestión de presupuestos no forma parte de esta presentación.
                  </p>
                </section>
                <template
                  x-for="module in tabs.filter(item => ['purchases','expenses','personnel','materials'].includes(item.id))"
                  :key="module.id"
                  ><section
                    role="tabpanel"
                    :id="'panel-' + module.id"
                    :aria-labelledby="'tab-' + module.id"
                    x-show="tab === module.id"
                    x-cloak
                    class="project-tab-panel panel"
                  >
                    <div class="panel-head">
                      <div>
                        <h2 x-text="module.label"></h2>
                        <p
                          x-text="rowsForTab(module.id).length + ' registros vinculados a este proyecto'"
                        ></p>
                      </div>
                      <a
                        x-show="!project.demo && (module.id !== 'materials' || hasWarehouse)"
                        :href="moduleHref(moduleForTab(module.id), project.id)"
                        x-text="'Abrir en ' + module.label + ' →'"
                      ></a>
                    </div>
                    <p x-show="module.id === 'materials' && !hasWarehouse">
                      Almacén y Materiales no está habilitado en esta presentación.
                    </p>
                    <p
                      x-show="!rowsForTab(module.id).length && (module.id !== 'materials' || hasWarehouse)"
                    >
                      No hay registros de esta sección para el proyecto.
                    </p>
                    <div class="workspace-record-list">
                      <template x-for="item in rowsForTab(module.id)" :key="item.id"
                        ><a :href="operationHref(item) || moduleHref('costs', project.id)"
                          ><span
                            ><strong x-text="item.id"></strong
                            ><small x-text="recordSubtitle(item)"></small></span
                          ><span
                            ><strong x-text="formatMoney(item.amount)"></strong
                            ><small x-text="item.status"></small></span></a
                      ></template>
                    </div></section
                ></template>
                <section
                  id="panel-costs"
                  role="tabpanel"
                  aria-labelledby="tab-costs"
                  x-show="tab === 'costs'"
                  x-cloak
                  class="project-tab-panel panel"
                >
                  <div class="panel-head">
                    <div>
                      <h2>Costos por fuente</h2>
                      <p>Cada monto lleva a sus operaciones de origen</p>
                    </div>
                    <a x-show="!project.demo" :href="moduleHref('costs', project.id)"
                      >Abrir en Costos →</a
                    >
                  </div>
                  <div class="workspace-summary-grid">
                    <div>
                      <span>Ejecutado</span
                      ><strong x-text="formatMoney(financials.executedCost)"></strong>
                    </div>
                    <div>
                      <span>Compromisos abiertos</span
                      ><strong x-text="formatMoney(financials.outstandingCommitments)"></strong>
                    </div>
                    <div>
                      <span>Saldo frente al ejecutado</span
                      ><strong x-text="formatMoney(financials.availableAgainstExecuted)"></strong>
                    </div>
                  </div>
                  <div class="workspace-record-list">
                    <template x-for="source in sources" :key="source.id"
                      ><a
                        :href="'./costs.html?project=' + encodeURIComponent(project.id) + '&source=' + encodeURIComponent(source.id)"
                        ><span><strong x-text="source.label"></strong></span
                        ><strong x-text="formatMoney(source.amount)"></strong></a
                    ></template>
                  </div>
                  <p x-show="!sources.length">Aún no hay costos ejecutados.</p>
                </section>
                <section
                  id="panel-documents"
                  role="tabpanel"
                  aria-labelledby="tab-documents"
                  x-show="tab === 'documents'"
                  x-cloak
                  class="project-tab-panel panel"
                >
                  <div class="panel-head">
                    <div>
                      <h2>Documentos vinculados</h2>
                      <p>Metadatos de soporte, sin archivo descargable</p>
                    </div>
                    <a
                      x-show="!project.demo"
                      :href="'./documents.html?project=' + encodeURIComponent(project.id)"
                      >Abrir en Documentos →</a
                    >
                  </div>
                  <div class="workspace-record-list">
                    <template x-for="item in documents" :key="item.id"
                      ><a :href="documentHref(item)"
                        ><span
                          ><strong x-text="item.fileName"></strong
                          ><small x-text="item.type + ' · ' + item.operationId"></small></span
                        ><small x-text="'V' + item.version"></small></a
                    ></template>
                  </div>
                  <p x-show="!documents.length">Aún no hay documentos vinculados.</p>
                </section>
                <section
                  id="panel-indicators"
                  role="tabpanel"
                  aria-labelledby="tab-indicators"
                  x-show="tab === 'indicators'"
                  x-cloak
                  class="project-tab-panel panel"
                >
                  <div class="panel-head">
                    <div>
                      <h2>Indicadores del proyecto</h2>
                      <p>Avance físico y ejecución presupuestaria</p>
                    </div>
                    <a x-show="!project.demo" :href="moduleHref('costs', project.id)"
                      >Abrir en Costos →</a
                    >
                  </div>
                  <div class="project-indicator-bars">
                    <div>
                      <span>Avance físico</span
                      ><strong x-text="project.progressPercent + ' %'"></strong>
                      <div class="progress">
                        <div
                          class="progress-bar"
                          :style="'width:' + project.progressPercent + '%'"
                        ></div>
                      </div>
                    </div>
                    <div>
                      <span>Presupuesto ejecutado</span
                      ><strong
                        x-text="String(financials.executionPercent).replace('.', ',') + ' %'"
                      ></strong>
                      <div class="progress">
                        <div class="progress-bar" :style="'width:' + executionWidth + '%'"></div>
                      </div>
                    </div>
                  </div>
                  <p>
                    Compara el trabajo informado con el costo ejecutado. Los importes detallados
                    están en Costos.
                  </p>
                </section>
              </div></template
            >
          </div>
        </main>
        <!-- APP_FOOTER -->
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
