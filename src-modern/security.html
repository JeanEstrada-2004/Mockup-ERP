<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Representación visual de controles de seguridad" />
    <meta name="theme-color" content="#1A365D" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <title>Seguridad</title>
  </head>
  <body data-page="security-workspace" class="admin-layout">
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="admin-app">
      <div class="admin-wrapper" id="admin-wrapper">
        <!-- APP_HEADER --><!-- APP_SIDEBAR -->
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main id="main-content" class="admin-main">
          <div
            class="container-fluid shell-page project-workspace delivery-nine-workspace security-workspace"
            x-data="securityWorkspace"
          >
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Seguridad</li>
              </ol>
            </nav>
            <template x-if="!allowed"
              ><div class="card">
                <div class="card-body workspace-empty">
                  <h1>Seguridad no disponible</h1>
                  <p>Este módulo no forma parte de esta presentación.</p>
                  <a class="btn btn-primary" href="./index.html">Volver al inicio</a>
                </div>
              </div></template
            >
            <template x-if="allowed"
              ><div>
                <div class="shell-page-heading">
                  <div>
<h1>Seguridad y Control de Acceso</h1>
                    <p class="shell-page-subtitle">
                      Usuarios, roles, permisos, sesiones, auditoría y respaldos.
                    </p>
                  </div>
                </div>
                <nav class="d9-tabs" aria-label="Secciones de Seguridad">
                  <template x-for="item in tabs" :key="item[0]"
                    ><button
                      type="button"
                      :class="tab === item[0] ? 'active' : ''"
                      :aria-current="tab === item[0] ? 'page' : null"
                      @click="setTab(item[0])"
                      x-text="item[1]"
                    ></button
                  ></template>
                </nav>
                <p class="workspace-caption d-md-none">
                  Desliza las pestañas para ver todas las secciones.
                </p>
                <section
                  x-show="tab === 'usuarios'"
                  class="card"
                  aria-labelledby="security-users-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <div>
                        <h2 id="security-users-title">Usuarios</h2>
                        <p class="workspace-caption">
                          Cuentas de acceso del personal de los proyectos.
                        </p>
                      </div>
                      <span
                        class="workspace-caption"
                        x-text="`${filteredUsers.length} perfiles`"
                      ></span>
                    </div>
                    <div class="security-filters mb-3">
                      <div>
                        <label class="form-label" for="security-search">Buscar</label
                        ><input
                          id="security-search"
                          class="form-control"
                          type="search"
                          x-model="search"
                          @input="updateUrl()"
                          placeholder="Nombre o código"
                        />
                      </div>
                      <div>
                        <label class="form-label" for="security-role">Rol</label
                        ><select
                          id="security-role"
                          class="form-select"
                          x-model="roleFilter"
                          @change="updateUrl()"
                        >
                          <option value="">Todos</option>
                          <template x-for="role in roleNames" :key="role"
                            ><option :value="role" x-text="role" :selected="role === roleFilter"></option
                          ></template>
                        </select>
                      </div>
                      <button
                        type="button"
                        class="btn btn-outline-secondary"
                        @click="clearFilters()"
                      >
                        Limpiar
                      </button>
                    </div>
                    <div class="table-responsive d-none d-lg-block">
                      <table class="table align-middle d9-table">
                        <thead>
                          <tr>
                            <th scope="col">Usuario</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Rol</th>
                            <th scope="col">Área</th>
                            <th scope="col">Último acceso</th>
                            <th scope="col">Estado</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="item in filteredUsers" :key="item.id"
                            ><tr>
                              <td class="data-code" x-text="item.alias"></td>
                              <td><a :href="workerHref(item.workerId)" x-text="item.name"></a></td>
                              <td x-text="item.role"></td>
                              <td x-text="item.area"></td>
                              <td x-text="item.lastAccess"></td>
                              <td><span class="badge status-badge status-badge--success" x-text="item.status"></span></td>
                            </tr></template
                          >
                        </tbody>
                      </table>
                    </div>
                    <div class="d9-mobile-list d-lg-none">
                      <template x-for="item in filteredUsers" :key="item.id"
                        ><article class="d9-mobile-card">
                          <div class="d9-mobile-heading">
                            <strong x-text="item.name"></strong
                            ><span class="badge text-bg-secondary">Ficticio</span>
                          </div>
                          <small x-text="`${item.id} · ${item.alias}`"></small
                          ><span x-text="`${item.role} · ${item.area}`"></span
                          ><a class="btn btn-outline-primary" :href="workerHref(item.workerId)"
                            >Ver trabajador</a
                          >
                        </article></template
                      >
                    </div>
                    <div class="d9-empty" x-show="filteredUsers.length === 0">
                      <p>No hay perfiles con estos filtros.</p>
                      <button type="button" class="btn btn-outline-primary" @click="clearFilters()">
                        Ver todos
                      </button>
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'roles'"
                  class="card"
                  aria-labelledby="security-roles-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="security-roles-title">Roles propuestos</h2>
                      <span class="workspace-caption">Sin aplicación real</span>
                    </div>
                    <div class="security-role-grid">
                      <template x-for="item in roles" :key="item.id"
                        ><article>
                          <strong x-text="item.name"></strong>
                          <p x-text="item.scope"></p>
                          <small class="text-muted" x-text="`${item.users} ${item.users === 1 ? 'usuario' : 'usuarios'}`"></small>
                        </article></template
                      >
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'permisos'"
                  class="card"
                  aria-labelledby="security-permissions-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="security-permissions-title">Matriz de permisos</h2>
                      <span class="workspace-caption">Sí · Parcial · No</span>
                    </div>
                    <div class="table-responsive">
                      <table class="table align-middle security-permissions-table">
                        <thead>
                          <tr>
                            <th scope="col">Acción</th>
                            <template x-for="role in permissionRoles" :key="role"><th scope="col" x-text="role"></th></template>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="item in permissionRows" :key="item.action"
                            ><tr>
                              <th scope="row" x-text="item.action"></th>
                              <template x-for="(value, index) in item.values" :key="index"
                                ><td><span class="badge status-badge" :class="value === 'Sí' ? 'status-badge--success' : value === 'Parcial' ? 'status-badge--warning' : ''" x-text="value"></span></td
                              ></template></tr
                          ></template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </section>
                <section x-show="tab === 'mfa'" class="card" aria-labelledby="security-mfa-title">
                  <div class="card-body">
                    <h2 id="security-mfa-title" class="workspace-subheading mt-0">
                      Autenticación multifactor
                    </h2>
                    <div class="d9-facts">
                      <div><small>Estado</small><strong><span class="badge status-badge status-badge--success" x-text="mfa.status"></span></strong></div>
                      <div><small>Métodos</small><strong x-text="mfa.methods"></strong></div>
                      <div><small>Alcance</small><strong x-text="mfa.coverage"></strong></div>
                      <div><small>Usuarios inscritos</small><strong x-text="mfa.enrolled"></strong></div>
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'sesiones'"
                  class="card"
                  aria-labelledby="security-sessions-title"
                >
                  <div class="card-body">
                    <h2 id="security-sessions-title" class="workspace-subheading mt-0">Sesiones</h2>
                    <div class="table-responsive data-table">
                      <table class="table align-middle mb-0">
                        <thead>
                          <tr>
                            <th scope="col">Usuario</th>
                            <th scope="col">Dispositivo</th>
                            <th scope="col">IP</th>
                            <th scope="col">Ubicación</th>
                            <th scope="col">Última actividad</th>
                            <th scope="col">Estado</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="item in sessions" :key="item.id">
                            <tr>
                              <td x-text="item.user"></td>
                              <td x-text="item.device"></td>
                              <td class="data-money" x-text="item.ip"></td>
                              <td x-text="item.location"></td>
                              <td x-text="item.activity"></td>
                              <td><span class="badge status-badge" :class="item.status === 'Activa' ? 'status-badge--success' : ''" x-text="item.status"></span></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'auditoria'"
                  class="card"
                  aria-labelledby="security-audit-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <div>
                        <h2 id="security-audit-title">Auditoría</h2>
                        <p class="workspace-caption">Últimas acciones sobre registros del sistema.</p>
                      </div>
                      <span class="workspace-caption" x-text="`${audit.length} eventos`"></span>
                    </div>
                    <div class="table-responsive d-none d-lg-block">
                      <table class="table align-middle d9-table">
                        <thead>
                          <tr>
                            <th scope="col">Fecha</th>
                            <th scope="col">Usuario</th>
                            <th scope="col">Acción</th>
                            <th scope="col">Módulo</th>
                            <th scope="col">Registro</th>
                            <th scope="col">Resultado</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="item in audit" :key="item.id"
                            ><tr>
                              <td x-text="`${formatDate(item.date)} ${item.time}`"></td>
                              <td x-text="item.actor"></td>
                              <td x-text="item.action"></td>
                              <td x-text="item.module"></td>
                              <td><a :href="item.href" x-text="item.operationId"></a></td>
                              <td><span class="badge status-badge status-badge--success" x-text="item.result"></span></td></tr
                          ></template>
                        </tbody>
                      </table>
                    </div>
                    <div class="d9-mobile-list d-lg-none">
                      <template x-for="item in audit" :key="item.id"
                        ><article class="d9-mobile-card">
                          <div class="d9-mobile-heading">
                            <strong x-text="item.operationId"></strong
                            ><small x-text="formatDate(item.date)"></small>
                          </div>
                          <span x-text="item.actor"></span
                          ><small x-text="`${item.module} · ${item.projectId}`"></small
                          ><a class="btn btn-outline-primary" :href="item.href">Abrir registro</a>
                        </article></template
                      >
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'backups'"
                  class="card"
                  aria-labelledby="security-backups-title"
                >
                  <div class="card-body">
                    <h2 id="security-backups-title" class="workspace-subheading mt-0">
                      Respaldos
                    </h2>
                    <div class="d9-facts">
                      <div><small>Último respaldo</small><strong x-text="formatDateTime(backup.last)"></strong></div>
                      <div><small>Estado</small><strong><span class="badge status-badge status-badge--success" x-text="backup.status"></span></strong></div>
                      <div><small>Modo</small><strong x-text="backup.mode"></strong></div>
                      <div><small>Próximo respaldo</small><strong x-text="formatDateTime(backup.next)"></strong></div>
                    </div>
                    <h3 class="form-section-title">Historial</h3>
                    <ol class="record-timeline">
                      <template x-for="item in backup.history" :key="item.date">
                        <li>
                          <i aria-hidden="true"></i>
                          <span><b x-text="formatDateTime(item.date)"></b><small x-text="`${item.size} · ${item.duration}`"></small></span>
                          <span class="badge status-badge status-badge--success" x-text="item.status"></span>
                        </li>
                      </template>
                    </ol>
                  </div>
                </section>
              </div></template
            >
          </div>
        </main>
        <!-- APP_FOOTER -->
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
