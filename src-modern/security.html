<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Representación visual de controles de seguridad" />
    <meta name="theme-color" content="#1A365D" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <title>Seguridad</title>
  </head>
  <body data-page="security-workspace" class="admin-layout">
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="admin-app">
      <div class="admin-wrapper" id="admin-wrapper">
        <!-- APP_HEADER --><!-- APP_SIDEBAR -->
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main id="main-content" class="admin-main">
          <div
            class="container-fluid shell-page project-workspace delivery-nine-workspace security-workspace"
            x-data="securityWorkspace"
          >
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Seguridad</li>
              </ol>
            </nav>
            <template x-if="!allowed"
              ><div class="card">
                <div class="card-body workspace-empty">
                  <h1>Seguridad no disponible</h1>
                  <p>Este módulo no forma parte de esta presentación.</p>
                  <a class="btn btn-primary" href="./index.html">Volver al inicio</a>
                </div>
              </div></template
            >
            <template x-if="allowed"
              ><div>
                <div class="shell-page-heading">
                  <div>
                    <p class="shell-eyebrow">CONTROL DE ACCESO PROPUESTO</p>
                    <h1>Seguridad</h1>
                    <p class="shell-page-subtitle">
                      Perfiles, permisos y trazas de ejemplo para revisar el diseño.
                    </p>
                  </div>
                </div>
                <div class="alert alert-warning" role="note">
                  <strong>Simulación visual.</strong> No existe autenticación, MFA, sesiones,
                  aplicación de permisos, auditoría ni respaldos reales.
                </div>
                <nav class="d9-tabs" aria-label="Secciones de Seguridad">
                  <template x-for="item in tabs" :key="item[0]"
                    ><button
                      type="button"
                      :class="tab === item[0] ? 'active' : ''"
                      :aria-current="tab === item[0] ? 'page' : null"
                      @click="setTab(item[0])"
                      x-text="item[1]"
                    ></button
                  ></template>
                </nav>
                <p class="workspace-caption d-md-none">
                  Desliza las pestañas para ver todas las secciones.
                </p>
                <section
                  x-show="tab === 'usuarios'"
                  class="card"
                  aria-labelledby="security-users-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <div>
                        <h2 id="security-users-title">Perfiles ficticios</h2>
                        <p class="workspace-caption">
                          Los nombres provienen de trabajadores de ejemplo, sin cuentas activas.
                        </p>
                      </div>
                      <span
                        class="workspace-caption"
                        x-text="`${filteredUsers.length} perfiles`"
                      ></span>
                    </div>
                    <div class="security-filters mb-3">
                      <div>
                        <label class="form-label" for="security-search">Buscar</label
                        ><input
                          id="security-search"
                          class="form-control"
                          type="search"
                          x-model="search"
                          @input="updateUrl()"
                          placeholder="Nombre o código"
                        />
                      </div>
                      <div>
                        <label class="form-label" for="security-role">Rol ilustrativo</label
                        ><select
                          id="security-role"
                          class="form-select"
                          x-model="roleFilter"
                          @change="updateUrl()"
                        >
                          <option value="">Todos</option>
                          <option value="Administrador de ejemplo">Administrador de ejemplo</option>
                          <option value="Responsable de proyecto">Responsable de proyecto</option>
                        </select>
                      </div>
                      <button
                        type="button"
                        class="btn btn-outline-secondary"
                        @click="clearFilters()"
                      >
                        Limpiar
                      </button>
                    </div>
                    <div class="table-responsive d-none d-lg-block">
                      <table class="table align-middle d9-table">
                        <thead>
                          <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Alias ficticio</th>
                            <th scope="col">Rol propuesto</th>
                            <th scope="col">Área</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Trabajador</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="item in filteredUsers" :key="item.id"
                            ><tr>
                              <td x-text="item.id"></td>
                              <td x-text="item.name"></td>
                              <td x-text="item.alias"></td>
                              <td x-text="item.role"></td>
                              <td x-text="item.area"></td>
                              <td>
                                <span class="badge text-bg-secondary" x-text="item.status"></span>
                              </td>
                              <td><a :href="workerHref(item.workerId)">Ver ficha →</a></td>
                            </tr></template
                          >
                        </tbody>
                      </table>
                    </div>
                    <div class="d9-mobile-list d-lg-none">
                      <template x-for="item in filteredUsers" :key="item.id"
                        ><article class="d9-mobile-card">
                          <div class="d9-mobile-heading">
                            <strong x-text="item.name"></strong
                            ><span class="badge text-bg-secondary">Ficticio</span>
                          </div>
                          <small x-text="`${item.id} · ${item.alias}`"></small
                          ><span x-text="`${item.role} · ${item.area}`"></span
                          ><a class="btn btn-outline-primary" :href="workerHref(item.workerId)"
                            >Ver trabajador</a
                          >
                        </article></template
                      >
                    </div>
                    <div class="d9-empty" x-show="filteredUsers.length === 0">
                      <p>No hay perfiles con estos filtros.</p>
                      <button type="button" class="btn btn-outline-primary" @click="clearFilters()">
                        Ver todos
                      </button>
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'roles'"
                  class="card"
                  aria-labelledby="security-roles-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="security-roles-title">Roles propuestos</h2>
                      <span class="workspace-caption">Sin aplicación real</span>
                    </div>
                    <div class="security-role-grid">
                      <template x-for="item in roles" :key="item.id"
                        ><article>
                          <strong x-text="item.name"></strong>
                          <p x-text="item.scope"></p>
                          <span class="badge text-bg-secondary">Ejemplo</span>
                        </article></template
                      >
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'permisos'"
                  class="card"
                  aria-labelledby="security-permissions-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <h2 id="security-permissions-title">Matriz de permisos ilustrativa</h2>
                      <span class="workspace-caption">No restringe la navegación</span>
                    </div>
                    <p class="workspace-caption">
                      Esta matriz sirve para discutir responsabilidades. Los enlaces del mockup
                      siguen abiertos.
                    </p>
                    <div class="table-responsive">
                      <table class="table align-middle security-permissions-table">
                        <thead>
                          <tr>
                            <th scope="col">Acción</th>
                            <th scope="col">Administrador</th>
                            <th scope="col">Proyectos</th>
                            <th scope="col">Logística</th>
                            <th scope="col">Colaborador</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="item in permissionRows" :key="item.action"
                            ><tr>
                              <th scope="row" x-text="item.action"></th>
                              <template x-for="(value, index) in item.values" :key="index"
                                ><td x-text="value"></td
                              ></template></tr
                          ></template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </section>
                <section x-show="tab === 'mfa'" class="card" aria-labelledby="security-mfa-title">
                  <div class="card-body">
                    <h2 id="security-mfa-title" class="workspace-subheading mt-0">
                      Autenticación multifactor prevista
                    </h2>
                    <div class="d9-facts">
                      <div><small>Estado real</small><strong>No implementada</strong></div>
                      <div>
                        <small>Métodos considerados</small
                        ><strong>Aplicación autenticadora o correo</strong>
                      </div>
                      <div>
                        <small>Alcance propuesto</small
                        ><strong>Acceso de usuarios y aprobaciones sensibles</strong>
                      </div>
                      <div><small>Demostración</small><strong>Solo diseño de interfaz</strong></div>
                    </div>
                    <p class="workspace-caption mt-3">
                      No se genera código, se envía correo ni se verifica un segundo factor.
                    </p>
                  </div>
                </section>
                <section
                  x-show="tab === 'sesiones'"
                  class="card"
                  aria-labelledby="security-sessions-title"
                >
                  <div class="card-body">
                    <h2 id="security-sessions-title" class="workspace-subheading mt-0">Sesiones</h2>
                    <div class="d9-empty">
                      <i class="bi bi-laptop" aria-hidden="true"></i>
                      <p>
                        Este frontend no crea ni registra sesiones. No hay dispositivos o
                        direcciones IP de usuarios que mostrar.
                      </p>
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'auditoria'"
                  class="card"
                  aria-labelledby="security-audit-title"
                >
                  <div class="card-body">
                    <div class="shell-section-header">
                      <div>
                        <h2 id="security-audit-title">Trazas de referencia</h2>
                        <p class="workspace-caption">
                          Ordenadas por la fecha ficticia de cada operación; no son un log de
                          acciones.
                        </p>
                      </div>
                      <span class="workspace-caption" x-text="`${audit.length} referencias`"></span>
                    </div>
                    <div class="table-responsive d-none d-lg-block">
                      <table class="table align-middle d9-table">
                        <thead>
                          <tr>
                            <th scope="col">Fecha</th>
                            <th scope="col">Actor ficticio</th>
                            <th scope="col">Referencia</th>
                            <th scope="col">Módulo</th>
                            <th scope="col">Registro</th>
                            <th scope="col">Proyecto</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="item in audit" :key="item.id"
                            ><tr>
                              <td x-text="formatDate(item.date)"></td>
                              <td x-text="item.actor"></td>
                              <td x-text="item.action"></td>
                              <td x-text="item.module"></td>
                              <td><a :href="item.href" x-text="item.operationId"></a></td>
                              <td x-text="item.projectId"></td></tr
                          ></template>
                        </tbody>
                      </table>
                    </div>
                    <div class="d9-mobile-list d-lg-none">
                      <template x-for="item in audit" :key="item.id"
                        ><article class="d9-mobile-card">
                          <div class="d9-mobile-heading">
                            <strong x-text="item.operationId"></strong
                            ><small x-text="formatDate(item.date)"></small>
                          </div>
                          <span x-text="item.actor"></span
                          ><small x-text="`${item.module} · ${item.projectId}`"></small
                          ><a class="btn btn-outline-primary" :href="item.href">Abrir registro</a>
                        </article></template
                      >
                    </div>
                  </div>
                </section>
                <section
                  x-show="tab === 'backups'"
                  class="card"
                  aria-labelledby="security-backups-title"
                >
                  <div class="card-body">
                    <h2 id="security-backups-title" class="workspace-subheading mt-0">
                      Plan de respaldos
                    </h2>
                    <div class="d9-facts">
                      <div>
                        <small>Frecuencia propuesta</small
                        ><strong>Diaria, sujeta a definición</strong>
                      </div>
                      <div>
                        <small>Verificación propuesta</small
                        ><strong>Prueba periódica de restauración</strong>
                      </div>
                      <div>
                        <small>Último respaldo real</small><strong>No existe en este mockup</strong>
                      </div>
                      <div><small>Historial</small><strong>Sin ejecuciones</strong></div>
                    </div>
                    <div class="d9-empty">
                      <i class="bi bi-hdd" aria-hidden="true"></i>
                      <p>No hay copias ni historial de respaldos generados por esta aplicación.</p>
                    </div>
                  </div>
                </section>
              </div></template
            >
          </div>
        </main>
        <!-- APP_FOOTER -->
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
