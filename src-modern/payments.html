<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Levantamiento del proceso de pagos" />
    <meta name="theme-color" content="#1A365D" />
    <!-- APP_FAVICON -->
    <title>Pagos · Proceso en levantamiento</title>
  </head>
  <body data-page="payments-workspace" class="admin-layout">
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="admin-app">
      <div class="admin-wrapper" id="admin-wrapper">
        <!-- APP_HEADER --><!-- APP_SIDEBAR -->
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main id="main-content" class="admin-main">
          <div class="container-fluid shell-page project-workspace" x-data="paymentsWorkspace">
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Pagos</li>
              </ol>
            </nav>
            <template x-if="!allowed"
              ><div class="card">
                <div class="card-body workspace-empty">
                  <h1>Pagos no disponible</h1>
                  <p>Este módulo no forma parte de esta presentación.</p>
                  <a class="btn btn-primary" href="./index.html">Volver al inicio</a>
                </div>
              </div></template
            >
            <!-- IF warehouseMode=single -->
            <template x-if="allowed"
              ><div>
                <div class="shell-page-heading">
                  <div>
                    <div
                      class="master-title-row"
                      data-maturity="validate"
                      data-maturity-note="El flujo de pagos, estados y autorizaciones aún debe levantarse con J&Y."
                    >
                      <h1>Pagos — Proceso en levantamiento</h1>
                    </div>
                    <p class="shell-page-subtitle">
                      Mapa de lo conocido y de las decisiones que faltan validar con J&Y.
                    </p>
                  </div>
                </div>
                <div class="row g-3">
                  <div class="col-12 col-lg-6">
                    <section class="card h-100" aria-labelledby="payments-known">
                      <div class="card-body">
                        <div
                          class="master-title-row"
                          data-maturity="as-is"
                          data-maturity-note="Información recogida en el análisis; no representa pagos realizados."
                        >
                          <h2 class="workspace-subheading" id="payments-known">Lo que se conoce</h2>
                        </div>
                        <ul class="mb-0">
                          <li>Pagos es un proceso separado de Compras.</li>
                          <li>Hay operaciones bancarias, principalmente con BCP.</li>
                          <li>
                            Existen constancias de pago; algunos pagos se vinculan con facturas.
                          </li>
                          <li>Parte del archivo documental es físico.</li>
                        </ul>
                      </div>
                    </section>
                  </div>
                  <div class="col-12 col-lg-6">
                    <section class="card h-100" aria-labelledby="payments-unknown">
                      <div class="card-body">
                        <div
                          class="master-title-row"
                          data-maturity="validate"
                          data-maturity-note="Preguntas abiertas; no se muestran como capacidades implementadas."
                        >
                          <h2 class="workspace-subheading" id="payments-unknown">
                            Por levantar con J&Y
                          </h2>
                        </div>
                        <ul class="mb-0">
                          <li>Estados y autorizaciones del flujo completo.</li>
                          <li>Tratamiento de pagos parciales.</li>
                          <li>Beneficiarios y prioridades.</li>
                          <li>Relación exacta entre OC, factura, pago y constancia.</li>
                        </ul>
                      </div>
                    </section>
                  </div>
                </div>
                <section class="card mt-3" aria-labelledby="payments-concept">
                  <div class="card-body">
                    <div
                      class="master-title-row"
                      data-maturity="to-be"
                      data-maturity-note="Esquema conceptual: los enlaces conducen a documentos ficticios del mockup, no a pagos procesados."
                    >
                      <h2 class="workspace-subheading" id="payments-concept">
                        Vista conceptual · Propuesta TO-BE
                      </h2>
                    </div>
                    <p>
                      Así podría relacionarse un registro de pago con los documentos existentes.
                      <strong>No es una transacción bancaria ni una constancia emitida.</strong>
                    </p>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                      <a class="btn btn-outline-primary" href="./purchase.html?id=OC-26-005"
                        >OC de ejemplo</a
                      ><span aria-hidden="true">→</span
                      ><span class="badge text-bg-secondary">Factura · vínculo por validar</span
                      ><span aria-hidden="true">→</span
                      ><span class="badge text-bg-secondary">Pago · sin estado definido</span
                      ><span aria-hidden="true">→</span
                      ><span class="badge text-bg-secondary">Constancia · ejemplo conceptual</span>
                    </div>
                    <p class="workspace-caption mt-3 mb-0">
                      La OC enlazada es una operación ficticia de inventario; no indica que se haya
                      pagado.
                    </p>
                  </div>
                </section>
              </div></template
            >
            <!-- /IF -->
          </div>
        </main>
        <!-- APP_FOOTER -->
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
