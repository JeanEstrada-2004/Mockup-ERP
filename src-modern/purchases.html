<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compras y órdenes de compra por proyecto" />
    <meta name="theme-color" content="#1A365D" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <title>Compras y Órdenes de Compra</title>
  </head>
  <body data-page="purchases-list" class="admin-layout">
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="admin-app">
      <div class="admin-wrapper" id="admin-wrapper">
        <!-- APP_HEADER -->
        <!-- APP_SIDEBAR -->
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main id="main-content" class="admin-main">
          <div
            class="container-fluid shell-page project-workspace commercial-workspace"
            x-data="purchasesList"
          >
            <nav aria-label="Ubicación">
              <ol class="breadcrumb shell-breadcrumb">
                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Compras</li>
              </ol>
            </nav>
            <div class="shell-page-heading">
              <div>
<h1>Compras y Órdenes de Compra</h1>
                <p class="shell-page-subtitle">
                  Seguimiento de solicitudes, aprobación y recepción por proyecto.
                </p>
              </div>
</div>
            <section class="card" aria-labelledby="purchases-list-heading">
              <div class="card-body">
                <div class="shell-section-header">
                  <h2 id="purchases-list-heading">Órdenes de compra</h2>
                  <span
                    class="text-muted small"
                    aria-live="polite"
                    x-text="`${filtered.length} de ${purchases.length} órdenes`"
                  ></span>
                </div>
                <div class="workspace-filters commercial-filters mb-3">
                  <div>
                    <label class="form-label" for="purchases-search">Buscar</label
                    ><input
                      id="purchases-search"
                      class="form-control"
                      type="search"
                      placeholder="N.º OC, proyecto o proveedor"
                      x-model="search"
                      @input="updateUrl()"
                    />
                  </div>
                  <div>
                    <label class="form-label" for="purchases-project">Proyecto</label
                    ><select
                      id="purchases-project"
                      class="form-select"
                      x-model="projectFilter"
                      @change="updateUrl()"
                    >
                      <option value="">Todos</option>
                      <template x-for="item in projects" :key="item.id"
                        ><option :value="item.id" x-text="item.id"></option
                      ></template>
                    </select>
                  </div>
                  <div>
                    <label class="form-label" for="purchases-supplier">Proveedor</label
                    ><select
                      id="purchases-supplier"
                      class="form-select"
                      x-model="supplierFilter"
                      @change="updateUrl()"
                    >
                      <option value="">Todos</option>
                      <template x-for="item in suppliers" :key="item.id"
                        ><option :value="item.id" x-text="item.name"></option
                      ></template>
                    </select>
                  </div>
                  <div>
                    <label class="form-label" for="purchases-status">Estado</label
                    ><select
                      id="purchases-status"
                      class="form-select"
                      x-model="statusFilter"
                      @change="updateUrl()"
                    >
                      <option value="">Todos</option>
                      <option>Pendiente</option>
                      <option>Aprobada</option>
                      <option>Atendida</option>
                    </select>
                  </div>
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    x-show="search || projectFilter || supplierFilter || statusFilter"
                    @click="clearFilters()"
                  >
                    Limpiar
                  </button>
                </div>
                <div class="table-responsive workspace-project-table commercial-table">
                  <table class="table table-hover align-middle mb-0">
                    <thead>
                      <tr>
                        <th scope="col">N.º OC</th>
                        <th scope="col">Proyecto</th>
                        <th scope="col">Proveedor</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Monto total</th>
                        <th scope="col">Estado</th>
                        <th scope="col"><span class="visually-hidden">Acción</span></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="item in filtered" :key="item.id"
                        ><tr>
                          <td><a :href="detailHref(item)" x-text="item.id"></a></td>
                          <td x-text="projectName(item.projectId)"></td>
                          <td x-text="supplierName(item.supplierId)"></td>
                          <td x-text="formatDate(item.date)"></td>
                          <td x-text="formatMoney(item.amount)"></td>
                          <td>
                            <span
                              class="badge"
                              :class="statusClass(item.status)"
                              x-text="item.status"
                            ></span>
                          </td>
                          <td>
                            <a :href="detailHref(item)" :aria-label="`Abrir ${item.id}`"
                              ><i class="bi bi-arrow-right" aria-hidden="true"></i
                            ></a>
                          </td></tr
                      ></template>
                    </tbody>
                  </table>
                </div>
                <div class="workspace-project-cards">
                  <template x-for="item in filtered" :key="item.id"
                    ><a class="workspace-project-card" :href="detailHref(item)"
                      ><span class="workspace-project-card-top"
                        ><strong x-text="item.id"></strong
                        ><span
                          class="badge"
                          :class="statusClass(item.status)"
                          x-text="item.status"
                        ></span></span
                      ><span
                        class="workspace-project-card-name"
                        x-text="projectName(item.projectId)"
                      ></span
                      ><small x-text="supplierName(item.supplierId)"></small
                      ><span class="workspace-project-card-metrics"
                        ><span
                          ><small>Fecha</small
                          ><strong x-text="formatDate(item.date)"></strong></span
                        ><span
                          ><small>Total</small
                          ><strong x-text="formatMoney(item.amount)"></strong></span></span
                      ><span class="workspace-project-card-end">Abrir orden →</span></a
                    ></template
                  >
                </div>
                <div class="workspace-empty" x-show="filtered.length === 0" role="status">
                  <i class="bi bi-search" aria-hidden="true"></i>
                  <p>No se encontraron órdenes de compra.</p>
                  <button
                    class="btn btn-outline-primary btn-sm"
                    type="button"
                    @click="clearFilters()"
                  >
                    Mostrar todas
                  </button>
                </div>
              </div>
            </section>
          </div>
        </main>
        <!-- APP_FOOTER -->
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
